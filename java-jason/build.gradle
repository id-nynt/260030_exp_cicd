plugins {
    id 'java'
}

defaultTasks 'run'

group = 'bdi.cicd'
version = '1.0.0'

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.jason:jason:3.3.0'
}

sourceSets {
    main {
        java {
            srcDirs = ['src/main/java', '../telemetry']
        }
        resources {
            srcDirs = ['src/main/resources']
        }
    }
    test {
        java {
            srcDirs = ['src/test/java']
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 17
}

test {
    useJUnitPlatform()
}

task runMock(type: JavaExec, dependsOn: classes) {
    mainClass = 'jason.infra.local.RunLocalMAS'
    classpath = sourceSets.main.runtimeClasspath
    workingDir projectDir
    args 'mock.mas2j'
}

// MAS Console. This follows the bdi/ sample: Gradle runs RunLocalMAS, which
// executes the selected .mas2j file and streams Jason/AgentSpeak output.
task run(type: JavaExec, dependsOn: classes) {
    group = 'Jason'
    description = 'runs the real BDI MAS console from real.mas2j'
    mainClass = 'jason.infra.local.RunLocalMAS'
    classpath = sourceSets.main.runtimeClasspath
    workingDir projectDir.parentFile
    args "${projectDir.name}/real.mas2j", '--log-conf', "${projectDir.name}/logging.properties"
}

// Explicit alias for callers that prefer a descriptive task name.
task runReal {
    dependsOn run
}

task runScenario(type: JavaExec, dependsOn: classes) {
    mainClass = 'jason.infra.local.RunLocalMAS'
    classpath = sourceSets.main.runtimeClasspath
    workingDir projectDir.parentFile
    systemProperty 'bdi.scenario', project.findProperty('scenario') ?: 'scenario1'
    args "${projectDir.name}/scenario.mas2j"
}
