# Generated from pipeline.yaml and goal.yaml

workflow:
  name: "CI/CD Pipeline"

  entities(E):
    - build
    - test
    - security
    - staging
    - production
    - rollback_production

  dependencies(D):
    - from: build
      to: test

    - from: test
      to: security

    - from: security
      to: staging

    - from: staging
      to: production

  observable_properties(O):
    status:
      values: [success, failure, cancelled, skipped, timeout]

    duration:
      value: time

  recovery(R):
    - from: production
      to: rollback_production

# Execution policy and observation contract.
execution:
  max_retries: 0
  observation_schema:
    status: [success, failure, cancelled, skipped, timeout]
    duration_unit: milliseconds
    required_for: [production]
    attempt_id_required: true

recovery_policy:
  rollback_production:
    run_after: production_failure
    retryable: false
    terminal_on_success: recovered
    terminal_on_failure: failed
