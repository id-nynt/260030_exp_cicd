name: Demo payment service CI/CD

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      service_version:
        description: Version label applied to the deployed containers
        required: false
        default: manual

permissions:
  contents: read

env:
  IMAGE_NAME: payment-service
  SERVICE_VERSION: ${{ inputs.service_version || github.sha }}

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Build application image
        run: docker build --tag "$IMAGE_NAME:${GITHUB_SHA}" ./app
      - name: Verify image metadata
        run: docker image inspect "$IMAGE_NAME:${GITHUB_SHA}"
      - name: Export image artifact
        run: docker save "$IMAGE_NAME:${GITHUB_SHA}" --output payment-service-image.tar
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: payment-image
          path: payment-service-image.tar
          retention-days: 7

  test:
    name: test
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: payment-image
      - name: Load image
        run: docker load --input payment-service-image.tar
      - name: Run automated tests
        run: docker run --rm "$IMAGE_NAME:${GITHUB_SHA}" python -m unittest discover -s . -p 'test_*.py'

  security:
    name: security
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: payment-image
      - name: Load image
        run: docker load --input payment-service-image.tar
      - name: Check Python dependency consistency
        run: docker run --rm "$IMAGE_NAME:${GITHUB_SHA}" python -m pip check
      - name: Check image does not run as root
        shell: bash
        run: test "$(docker inspect --format '{{.Config.User}}' "$IMAGE_NAME:${GITHUB_SHA}")" = "appuser"
      - name: Check for accidentally committed secrets
        shell: bash
        run: |
          if grep -RInE '(BEGIN (RSA|OPENSSH|EC) PRIVATE KEY|gh[pousr]_[A-Za-z0-9_]+|AKIA[0-9A-Z]{16})' app; then
            echo 'Potential secret found in application files'
            exit 1
          fi

  staging:
    name: staging
    needs: security
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: payment-image
      - name: Load image
        run: docker load --input payment-service-image.tar
      - name: Deploy staging
        run: |
          docker run --detach --name payment-staging --publish 8081:8080 \
            --env SERVICE_VERSION="$SERVICE_VERSION" \
            --env DEPLOYMENT_ENVIRONMENT=staging \
            --env FAILURE_MODE=none \
            "$IMAGE_NAME:${GITHUB_SHA}"
      - name: Verify staging health
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent http://localhost:8081/health; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Generate staging request and verify telemetry
        run: |
          curl --fail --silent --request POST --header 'Content-Type: application/json' \
            --data '{"amount":10}' http://localhost:8081/pay
          curl --fail --silent http://localhost:8081/metrics | grep -E 'payment_(request_count|error_count|error_rate|request_latency_ms)'
      - name: Save staging logs
        if: always()
        run: docker logs payment-staging > staging-container.log 2>&1 || true
      - name: Upload staging logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: staging-logs-${{ github.run_id }}
          path: staging-container.log

  production:
    name: production
    needs: staging
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: payment-image
      - name: Load image
        run: docker load --input payment-service-image.tar
      - name: Deploy production
        run: |
          docker run --detach --name payment-production --publish 8082:8080 \
            --env SERVICE_VERSION="$SERVICE_VERSION" \
            --env DEPLOYMENT_ENVIRONMENT=production \
            --env FAILURE_MODE=none \
            "$IMAGE_NAME:${GITHUB_SHA}"
      - name: Verify production health
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent http://localhost:8082/health; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Generate production request and verify telemetry
        run: |
          curl --fail --silent --request POST --header 'Content-Type: application/json' \
            --data '{"amount":10}' http://localhost:8082/pay
          curl --fail --silent http://localhost:8082/metrics | grep -E 'payment_(request_count|error_count|error_rate|request_latency_ms)'
      - name: Save production logs
        if: always()
        run: docker logs payment-production > production-container.log 2>&1 || true
      - name: Upload production logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-logs-${{ github.run_id }}
          path: production-container.log
