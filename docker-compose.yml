services:
  staging:
    build: ./app
    container_name: bdi-payment-staging
    ports:
      - "8081:8080"
    environment:
      SERVICE_VERSION: ${STAGING_SERVICE_VERSION:-staging-1}
      DEPLOYMENT_ENVIRONMENT: staging
      FAILURE_MODE: ${STAGING_FAILURE_MODE:-none}
      FORCE_ERROR_RATE: ${STAGING_FORCE_ERROR_RATE:-0}
      EXTRA_LATENCY_MS: ${STAGING_EXTRA_LATENCY_MS:-0}

  production:
    build: ./app
    container_name: bdi-payment-production
    ports:
      - "8082:8080"
    environment:
      SERVICE_VERSION: ${PRODUCTION_SERVICE_VERSION:-production-1}
      DEPLOYMENT_ENVIRONMENT: production
      FAILURE_MODE: ${PRODUCTION_FAILURE_MODE:-none}
      FORCE_ERROR_RATE: ${PRODUCTION_FORCE_ERROR_RATE:-0}
      EXTRA_LATENCY_MS: ${PRODUCTION_EXTRA_LATENCY_MS:-0}
